<!-- Kana type selection -->
<div class="mode-select">
    <label>
        <input type="radio" name="kana-type" value="hiragana" checked>
        <span id="type-hiragana"></span>
    </label>
    <label>
        <input type="radio" name="kana-type" value="katakana">
        <span id="type-katakana"></span>
    </label>
    <label>
        <input type="radio" name="kana-type" value="mixed">
        <span id="type-mixed"></span>
    </label>
</div>

<!-- Practice mode selection (NEW) -->
<div class="practice-mode-select">
    <h4 id="practice-mode-title"></h4>
    <div class="mode-options">
        <label class="mode-option quick-mode">
            <input type="radio" name="practice-mode" value="quick" checked>
            <div class="mode-icon">🚀</div>
            <div class="mode-info">
                <span class="mode-name" id="mode-quick-name"></span>
                <span class="mode-desc" id="mode-quick-desc"></span>
            </div>
        </label>
        
        <label class="mode-option custom-mode">
            <input type="radio" name="practice-mode" value="custom">
            <div class="mode-icon">⚙️</div>
            <div class="mode-info">
                <span class="mode-name" id="mode-custom-name"></span>
                <span class="mode-desc" id="mode-custom-desc"></span>
            </div>
        </label>
    </div>
</div>

<!-- Quick mode options -->
<div id="quick-mode-options" class="mode-config">
    <!-- Range selection for quick mode -->
    <div class="config-group">
        <label id="quick-range-label">練習範圍：</label>
        <div class="quick-range-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0;">
            <label class="quick-range-option" style="display: flex; align-items: center; padding: 8px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">
                <input type="checkbox" name="quick-range" value="basic" checked style="margin-right: 8px;">
                <span id="quick-basic-label">清音 (五十音)</span>
            </label>
            <label class="quick-range-option" style="display: flex; align-items: center; padding: 8px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">
                <input type="checkbox" name="quick-range" value="dakuten" style="margin-right: 8px;">
                <span id="quick-dakuten-label">濁音 (が、ざ、だ...)</span>
            </label>
            <label class="quick-range-option" style="display: flex; align-items: center; padding: 8px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">
                <input type="checkbox" name="quick-range" value="handakuten" style="margin-right: 8px;">
                <span id="quick-handakuten-label">半濁音 (ぱ行)</span>
            </label>
            <label class="quick-range-option" style="display: flex; align-items: center; padding: 8px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">
                <input type="checkbox" name="quick-range" value="youon" style="margin-right: 8px;">
                <span id="quick-youon-label">拗音 (きゃ、しゅ、ちょ...)</span>
            </label>
        </div>
    </div>
    
    <!-- Question count selection -->
    <div class="config-group">
        <label for="quick-question-count" id="quick-count-label">題數：</label>
        <select id="quick-question-count">
            <option value="10" id="quick-count-10">10 題</option>
            <option value="15" selected id="quick-count-15">15 題</option>
            <option value="20" id="quick-count-20">20 題</option>
        </select>
    </div>
</div>

<button id="start-btn"></button>

<!-- Quiz area -->
<div id="quiz-area" style="display: none;">
    <!-- Progress bar -->
    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>
    
    <!-- Statistics info -->
    <div class="stats">
        <div class="stat-item">
            <div class="stat-number" id="current-num">1</div>
            <div class="stat-label" id="stat-current"></div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="total-num">0</div>
            <div class="stat-label" id="stat-total"></div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="score-num">0</div>
            <div class="stat-label" id="stat-score"></div>
        </div>
        <div class="stat-item">
            <div class="stat-number" id="accuracy">0%</div>
            <div class="stat-label" id="stat-accuracy"></div>
        </div>
    </div>

    <!-- Quiz section -->
    <div class="quiz-container">
        <div class="kana" id="kana"></div>
        <input id="answer" placeholder="請輸入羅馬字" data-i18n-placeholder="practice.enterRomaji">
        <button id="submit-btn" data-i18n="practice.submitAnswer">提交</button>
        <div class="result" id="feedback"></div>
        <img src="kabo-seed.gif" style="width:300px; height:auto; margin-top: 20px;" alt="Kabo Seed GIF" style="width:300px; height:auto; margin-top: 20px;">
    </div>
</div>
